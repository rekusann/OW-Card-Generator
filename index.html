<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Generator</title>
<link href="style.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="app">

  <!-- フォーム -->
  <div class="form-pane">
    <h1 class="form-title">Card Generator</h1>

    <fieldset class="form-section">
      <legend>① カード情報</legend>

      <label class="field-label">数字</label>
      <div id="acc-card-number" class="field-mount"></div>

      <label class="field-label">タグ</label>
      <input type="text" id="input-tag" class="form-input" value="#LookingForTeam">

      <label class="field-label checkbox-line">
        <input type="checkbox" id="chk-logo" class="form-checkbox" checked>
        ロゴを表示する
      </label>

      <label class="field-label">背景キャラ</label>
      <div id="acc-bg-hero" class="field-mount">読み込み中...</div>
    </fieldset>

    <fieldset class="form-section">
      <legend>② プロフィール</legend>

      <label class="field-label">名前</label>
      <input type="text" id="input-name" class="form-input" value="Player">

      <label class="field-label">XのID</label>
      <input type="text" id="input-xid" class="form-input" placeholder="player_1234">

      <label class="field-label">In Game Name</label>
      <input type="text" id="input-battletag" class="form-input" placeholder="Player#1234">

      <label class="field-label">ロール（最大2つ）</label>
      <div id="acc-role" class="field-mount"></div>

      <label class="field-label">得意ヒーロー（最大3人）</label>
      <div id="acc-hero-pool" class="field-mount">読み込み中...</div>
    </fieldset>

    <fieldset class="form-section">
      <legend class="legend-with-toggle">
        <span>③ 過去の大会結果</span>
        <label class="section-toggle-label">
          <input type="checkbox" id="chk-sec-results" class="form-checkbox" checked> 表示
        </label>
      </legend>

      <div id="results-form-list" class="repeat-list"></div>
      <button type="button" id="btn-add-result" class="form-btn">＋ 大会結果を追加</button>
    </fieldset>

    <fieldset class="form-section">
      <legend class="legend-with-toggle">
        <span>④ 自己紹介</span>
        <label class="section-toggle-label">
          <input type="checkbox" id="chk-sec-intro" class="form-checkbox" checked> 表示
        </label>
      </legend>

      <label class="field-label">自己紹介文</label>
      <textarea id="input-intro" class="form-input" rows="4">こんにちは</textarea>
    </fieldset>

    <fieldset class="form-section">
      <legend class="legend-with-toggle">
        <span>⑤ 一問一答</span>
        <label class="section-toggle-label">
          <input type="checkbox" id="chk-sec-interview" class="form-checkbox" checked> 表示
        </label>
      </legend>

      <div id="interview-form-list" class="repeat-list"></div>
      <button type="button" id="btn-add-interview" class="form-btn">＋ 質問を追加</button>
    </fieldset>

    <fieldset class="form-section">
      <legend class="legend-with-toggle">
        <span>⑥ 他己紹介</span>
        <label class="section-toggle-label">
          <input type="checkbox" id="chk-sec-wtpl" class="form-checkbox" checked> 表示
        </label>
      </legend>

      <div id="wtpl-form-list" class="repeat-list"></div>
      <button type="button" id="btn-add-wtpl" class="form-btn">＋ コメントを追加</button>
    </fieldset>

    <fieldset class="form-section">
      <legend>⑦ 画像出力</legend>

      <label class="field-label">画像サイズ</label>
      <div id="acc-scale" class="field-mount"></div>

      <button type="button" id="btn-export" class="form-btn form-btn-primary">PNGを出力する</button>
    </fieldset>
  </div>

  <!-- プレビュー -->
  <div class="preview-pane" id="preview-pane">
    <div class="preview-scale-wrapper" id="preview-scale-wrapper">
      <div class="preview-scale-inner" id="preview-scale-inner">

        <div class="container" id="card-container">
          <div class="card-info">
            <div class="card-info-0">
              <div class="card-info-1"><span id="card-number">01</span><span class="code">lllll l  ll lll l l l ll llllll ll ll</span></div>
              <div class="card-info-2" id="card-tag">#LookingForTeam</div>
            </div>
            <img src="./img/rev_logo.png" class="revati-logo" id="revati-logo-img" alt="revati_logo">
          </div>

          <div class="sec-player-profile">
            <div class="heading">01 Player_Profile</div>
            <div class="player-name" id="player-name-el">Player</div>
            <div class="prof-el" id="x-id"><div class="sub-heading">[X_ID]</div><span id="x-id-value"></span></div>
            <div class="prof-el" id="battletag"> <div class="sub-heading">[In_Game_Name]</div> <div id="battletag-cont"><span id="battletag-name"></span><span id="battletag-cont-2"></span></div> </div>
            <div class="prof-el" id="role"> <div class="sub-heading">[Role]</div> <div id="role-cont"></div> </div>
            <div class="prof-el" id="hero-pool"> <div class="sub-heading">[Hero_Pool]</div> <div id="hero-pool-cont"></div> </div>
          </div>

          <div class="sec-results">
            <div class="heading">02 Results</div>
            <div class="results-table-box">
              <table class="results-table">
                <tbody id="results-tbody"></tbody>
              </table>
            </div>
          </div>

          <div class="sec-self-introduction">
            <div class="heading">03 Self_Introduction</div>
            <div class="self-introduction" id="self-intro-el">こんにちは</div>
          </div>

          <div class="sec-mini-interview">
            <div class="heading">04 Mini_Interview</div>
            <div class="mini-interview" id="interview-list-el"></div>
          </div>

          <div class="sec-wtpl">
            <div class="heading">05 What_is_the_player_like?</div>
            <div class="wtpl" id="wtpl-list-el"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
